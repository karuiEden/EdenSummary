name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # Tests import modules that build settings at import time (e.g. the Celery
      # app in worker.py needs REDIS_PASSWORD). Provide dummy config from the
      # template — the same `cp .env.example .env` step the README documents.
      - name: Create test env file
        run: cp .env.example .env

      - name: Lint
        run: uv run ruff check eden_summary/

      - name: Type check
        run: uv run mypy eden_summary/

      - name: Test
        run: uv run pytest tests/unit tests/integration -v