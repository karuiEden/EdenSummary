services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    depends_on:
      celery_worker:
        condition: service_started
      migrate:
         condition: service_completed_successfully
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: worker
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
         condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    command: uv run celery -A eden_summary.worker.worker worker --loglevel=info -E
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  db:
    image: postgres:18
    container_name: postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}", "-d", "${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  migrate:
    build: .
    command: uv run alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  minio:
    image: quay.io/minio/aistor/minio
    volumes:
      - ./minio/data:/mnt/data
      - ./minio/minio.license:/minio.license
    command: minio server /mnt/data --license /minio.license
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc admin user add local $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc admin policy attach local readwrite --user $$S3_ACCESS_KEY
      "
  test-unit:
    build: .
    env_file: .env
    environment:
      - UV_LINK_MODE=copy
    volumes:
      - .:/app
      - /app/.venv
    command: sh -c "uv sync --group dev && uv run pytest tests/unit tests/integration -v"
  test-api:
    build: .
    env_file: .env
    environment:
      - UV_LINK_MODE=copy
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    command: sh -c "uv sync --group dev && uv run pytest tests/api -v"
  whisper-server:
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["local-asr"]
    ports:
      - "8001:8000"
    environment:
      - 'PRELOAD_MODELS=["${WHISPER_MODEL}"]'
      - WHISPER_VAD_FILTER=${WHISPER_VAD_FILTER:-true}
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
  flower:
    build: .
    container_name: flower
    command: uv run celery -A eden_summary.worker.worker flower --port=5555
    environment:
      FLOWER_BASIC_AUTH: ${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped