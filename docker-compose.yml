services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    depends_on: celery_worker
    healthcheck:
      test: ["CMD", "curl", "-X", "'GET'", "'http://0.0.0.0:8000/health'", "-H", "'accept:" "application/json'",
             "-H" "'api-key:", "$X_API_KEY'"]

  celery_worker:
    image: celery:latest
    container_name: worker
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command:
      - celery -A system.worker worker


  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./redis_data:/data
    command:
      - redis-server --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
