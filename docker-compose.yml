services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    depends_on:
      celery_worker:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "-H", "x-api-key: ${X_API_KEY}", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: worker
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A eden_summary.worker worker
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
