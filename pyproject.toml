[project]
name = "edensummary"
version = "0.1.0"
description = "AI System for Summary long meetings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.136.1",
    "faster-whisper>=1.2.1",
    "litellm>=1.85.0",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.28",
    "ruff>=0.15.13",
    "uvicorn>=0.47.0",
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true

[tool.ruff]
line-length = 100
